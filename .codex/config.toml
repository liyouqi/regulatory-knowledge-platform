# Project-scoped Codex defaults. Codex loads this file only for a trusted project.

model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
model_verbosity = "low"

[features]
fast_mode = false
multi_agent = true

[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "low"

[agents.cost_worker]
description = "Lowest-cost verified worker for bounded extraction, classification, search, normalization, mechanical edits, and batch tasks."
config_file = "./agents/luna-worker.toml"

[agents.terra_analyst]
description = "Terra analyst for independent multi-file analysis, debugging, integration, and review when the main thread needs a separate workstream."
config_file = "./agents/terra-analyst.toml"

[agents.sol_expert]
description = "Read-only expert escalation for unresolved high-impact architecture, security, evidence-conflict, or regulatory questions; requires explicit user approval."
config_file = "./agents/sol-expert.toml"
